<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overpass Maps</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="editor">
        <!-- Mirrors the textarea's text so {{tokens}} can be highlighted behind it. -->
        <div class="backdrop" aria-hidden="true"><div id="highlights"></div></div>
        <textarea id="query" spellcheck="false" aria-label="Overpass query" aria-describedby="tokens"></textarea>
      </div>

      <div class="body">
        <p id="tokens" class="tokens"></p>

        <div class="run-row">
          <button id="run" class="run">Run query <kbd id="shortcut"></kbd></button>
          <p id="activity" class="activity" role="status"></p>
        </div>

        <div class="legend">
          <label class="swatch" title="Overlay colour">
            <input id="color" type="color" aria-label="Overlay colour" />
          </label>
          <p id="results" class="results"></p>
          <div class="legend-actions">
            <button id="zoom" class="text">Zoom to</button>
            <button id="toggle" class="text"></button>
            <button id="clear" class="text">Clear</button>
          </div>
        </div>

        <details id="settings">
          <summary>Settings</summary>
          <div class="settings">
            <label class="inline">
              Search at least <input id="minBboxKm" type="number" min="0" step="0.5" /> km across
            </label>
            <label class="stack">
              Overpass server
              <select id="server"></select>
            </label>
            <label class="stack" id="custom-row" hidden>
              Server address
              <input id="endpoint" type="url" pattern="https://.*" placeholder="https://…/api/interpreter" />
            </label>
          </div>
        </details>

        <p class="credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a></p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
